<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b12"><title>PromptLab — AI Prompt Library</title><style>
:root{
  --bg:#ffffff;
  --surface:#ffffff;
  --soft:#f7f7f8;
  --soft-2:#f1f2f4;
  --text:#141414;
  --muted:#6f7177;
  --line:#e9eaed;
  --line-strong:#dcdde1;
  --purple:#6c57ee;
  --purple-soft:#f1efff;
  --purple-hover:#5a45de;
  --gold:#a66b00;
  --gold-soft:#fff8e8;
  --green:#177c4d;
  --shadow:0 8px 30px rgba(17,18,22,.06);
  --shadow-lg:0 18px 60px rgba(17,18,22,.09);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:Inter,"Helvetica Neue",Arial,system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.w{width:min(1180px,calc(100% - 40px));margin:auto}

.top{
  position:sticky;top:0;z-index:30;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(20,20,20,.06);
}
.nav{height:72px;display:flex;align-items:center;gap:28px}
.brand{
  margin-right:auto;
  font-size:1.17rem;
  font-weight:800;
  letter-spacing:-.045em;
  display:flex;align-items:center;gap:8px;
}
.brand:before{
  content:"";
  width:26px;height:26px;border-radius:8px;
  background:linear-gradient(145deg,#7a67f5,#5a43d5);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);
}
.brand b{color:var(--purple)}
.links{display:flex;gap:25px;color:#575a61;font-size:.92rem}
.links a{transition:.18s color}
.links a:hover{color:#111}
.btn{
  border:1px solid transparent;
  border-radius:11px;
  padding:10px 15px;
  background:#151515;
  color:#fff;
  font-weight:700;
  transition:.18s transform,.18s background,.18s border-color,.18s box-shadow;
}
.btn:hover{transform:translateY(-1px)}
.primary{
  background:var(--purple);
  color:white;
  box-shadow:0 7px 22px rgba(108,87,238,.18);
}
.primary:hover{background:var(--purple-hover)}
.ghost{
  background:white;
  color:#252525;
  border-color:var(--line-strong);
}
.ghost:hover{background:var(--soft)}
.pill{
  border:1px solid #eadfbf;
  background:var(--gold-soft);
  border-radius:999px;
  padding:8px 11px;
  color:var(--gold);
  font-weight:800;
  font-size:.87rem;
}

.hero{
  padding:92px 0 68px;
  display:grid;
  grid-template-columns:1.15fr .85fr;
  gap:60px;
  align-items:center;
  position:relative;
}
.hero:before{
  content:"";
  position:absolute;
  width:430px;height:430px;border-radius:50%;
  background:radial-gradient(circle,rgba(108,87,238,.09),rgba(108,87,238,0) 70%);
  right:-130px;top:-40px;pointer-events:none;
}
.tag{
  display:inline-flex;align-items:center;
  padding:6px 9px;
  border:1px solid var(--line);
  background:var(--soft);
  color:#595c63;
  border-radius:999px;
  font-size:.69rem;
  font-weight:800;
  letter-spacing:.075em;
  text-transform:uppercase;
}
.hero h1,.title{
  margin:18px 0 22px;
  font-size:clamp(3.2rem,6.8vw,6.25rem);
  line-height:.94;
  letter-spacing:-.068em;
  font-weight:760;
}
.title{font-size:clamp(2.7rem,5.5vw,5rem)}
.grad{color:var(--purple);background:none;-webkit-text-fill-color:initial}
.lead{
  max-width:700px;
  color:var(--muted);
  line-height:1.75;
  font-size:1.08rem;
}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:27px}

.panel{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:20px;
  padding:24px;
  box-shadow:var(--shadow);
}
.hero .panel{
  background:linear-gradient(180deg,#fff,#fbfbfc);
  box-shadow:var(--shadow-lg);
  border-color:#e7e5f5;
}
.fake{
  margin-top:16px;
  background:#fafafa;
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px;
  color:#7a7d84;
  font:500 .82rem/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;
  filter:blur(2.2px);
  user-select:none;
}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center}

.page{padding:58px 0 92px}
.page>h2{font-size:2rem;letter-spacing:-.035em;margin-top:40px}
.grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:20px;
  margin-top:20px;
}
.card{
  background:white;
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
  transition:.2s transform,.2s box-shadow,.2s border-color;
}
.card:hover{
  transform:translateY(-3px);
  box-shadow:var(--shadow-lg);
  border-color:#dcd9ef;
}
.cover{
  height:200px;
  padding:17px;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 80% 20%,rgba(108,87,238,.19),transparent 35%),
    linear-gradient(135deg,#f7f5ff,#ece9ff);
}
.cover.cyan{
  background:
    radial-gradient(circle at 80% 18%,rgba(56,166,190,.16),transparent 36%),
    linear-gradient(135deg,#f5fbfc,#e8f5f7);
}
.cover.gold{
  background:
    radial-gradient(circle at 82% 20%,rgba(199,147,48,.15),transparent 36%),
    linear-gradient(135deg,#fffaf0,#f8f0da);
}
.badge{
  display:inline-flex;
  background:rgba(255,255,255,.85);
  border:1px solid rgba(20,20,20,.08);
  border-radius:999px;
  padding:6px 9px;
  font-size:.69rem;
  font-weight:800;
  color:#474a50;
  backdrop-filter:blur(8px);
}
.emoji{
  position:absolute;
  left:18px;bottom:17px;
  font-size:2.1rem;
  filter:saturate(.9);
}
.body{padding:18px 18px 19px}
.meta{
  color:#878a91;
  font-size:.72rem;
  margin-bottom:8px;
  text-transform:uppercase;
  letter-spacing:.045em;
  font-weight:700;
}
.body h3{
  margin:0 0 8px;
  font-size:1.07rem;
  line-height:1.32;
  letter-spacing:-.02em;
}
.body p{
  color:var(--muted);
  line-height:1.58;
  font-size:.86rem;
  margin:0;
  min-height:54px;
}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:15px;font-size:.82rem}
.price{color:var(--gold);font-weight:850}
.owned{color:var(--green);font-weight:800}

.ad{
  border:1px solid #ece6d7;
  background:#fffdf8;
  padding:17px 18px;
  border-radius:16px;
  margin:28px 0;
  display:flex;
  align-items:center;
  gap:18px;
}
.ad small{
  color:#9c7a34;
  text-transform:uppercase;
  letter-spacing:.095em;
  font-size:.64rem;
  font-weight:900;
}
.ad h4{margin:3px 0 4px;font-size:1rem}
.ad p{margin:0;color:#797b80;font-size:.84rem}
.ad .btn{margin-left:auto;white-space:nowrap;background:#fff;color:#292929;border-color:#ded8c9}

.search{display:grid;grid-template-columns:1fr 220px;gap:10px;margin:24px 0}
.input,select,textarea{
  width:100%;
  background:white;
  color:#202020;
  border:1px solid var(--line-strong);
  border-radius:11px;
  padding:11px 12px;
  outline:none;
  transition:.18s border-color,.18s box-shadow;
}
.input:focus,select:focus,textarea:focus{
  border-color:#a99cf4;
  box-shadow:0 0 0 3px rgba(108,87,238,.08);
}

.prompt{
  display:grid;
  grid-template-columns:minmax(0,1fr) 330px;
  gap:24px;
}
.copy{color:#5f6268;line-height:1.82}
.secret{
  white-space:pre-wrap;
  background:#f8f8f9;
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px;
  color:#35373b;
  font:500 .84rem/1.72 ui-monospace,SFMono-Regular,Menlo,monospace;
}
.lock{
  text-align:center;
  border:1px solid #ddd8ff;
  border-radius:16px;
  padding:30px;
  background:#faf9ff;
  margin-top:24px;
}
.info{
  display:flex;justify-content:space-between;gap:14px;
  border-top:1px solid var(--line);
  padding:12px 0;
  color:#74777d;
  font-size:.84rem;
}
.info b{color:#222}
.sticky{position:sticky;top:92px}

.auth{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.form{display:grid;gap:12px}
.tabs{
  display:flex;
  padding:4px;
  background:var(--soft);
  border:1px solid var(--line);
  border-radius:12px;
  margin-bottom:17px;
}
.tabs button{
  flex:1;border:0;background:transparent;color:#7a7d83;
  padding:9px;border-radius:8px;font-weight:750;
}
.tabs .on{background:white;color:#161616;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.notice{
  border:1px solid #ddd8ff;
  background:#f8f7ff;
  color:#5b51a6;
  border-radius:11px;
  padding:11px;
  font-size:.84rem;
}
.wallet{
  font-size:3.7rem;
  font-weight:800;
  color:var(--gold);
  letter-spacing:-.06em;
}
.packs{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.pack{
  background:white;
  border:1px solid var(--line);
  border-radius:15px;
  padding:18px;
  box-shadow:var(--shadow);
}
.empty{
  grid-column:1/-1;
  text-align:center;
  border:1px dashed var(--line-strong);
  border-radius:16px;
  padding:48px;
  background:var(--soft);
  color:#777a80;
}
.hide{display:none!important}
.small{color:#85888f;font-size:.82rem;line-height:1.5}
.toast{
  position:fixed;
  right:20px;bottom:20px;
  background:#181818;color:#fff;
  border:1px solid #292929;
  border-radius:11px;
  padding:11px 13px;
  opacity:0;
  transform:translateY(6px);
  pointer-events:none;
  transition:.2s;
  box-shadow:var(--shadow-lg);
}
.toast.show{opacity:1;transform:translateY(0)}

.footer{
  border-top:1px solid var(--line);
  padding:30px 0 42px;
  color:#83868d;
  background:#fbfbfc;
}
.footer b{color:#222}

@media(max-width:900px){
  .hero,.prompt,.auth{grid-template-columns:1fr}
  .hero{gap:32px;padding-top:64px}
  .grid{grid-template-columns:repeat(2,1fr)}
  .links{display:none}
  .sticky{position:static}
}
@media(max-width:620px){
  .w{width:min(100% - 24px,1180px)}
  .nav{height:64px}
  .hero{padding:50px 0 42px}
  .hero h1{font-size:clamp(2.75rem,14vw,4.6rem)}
  .grid,.packs{grid-template-columns:1fr}
  .search{grid-template-columns:1fr}
  .cover{height:180px}
  .ad{flex-direction:column;align-items:flex-start}
  .ad .btn{margin-left:0}
  .pill{display:none}
}

/* Admin dashboard */
.admin-page{padding-top:46px}
.admin-head,.admin-section-head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
.admin-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:26px 0 48px}
.stat{border:1px solid var(--line);border-radius:16px;padding:18px;background:#fff;box-shadow:var(--shadow)}
.stat span{display:block;color:var(--muted);font-size:.78rem;margin-bottom:8px}
.stat b{font-size:2rem;letter-spacing:-.05em}
.admin-section{margin-top:54px}
.admin-section-head{align-items:center;margin-bottom:16px}
.admin-section-head h2{margin:8px 0 0;font-size:1.75rem;letter-spacing:-.035em}
.admin-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(330px,.8fr);gap:18px;align-items:start}
.admin-list{padding:0;overflow:hidden}
.admin-row{display:flex;justify-content:space-between;gap:18px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.admin-row:last-child{border-bottom:0}
.admin-row-actions{display:flex;gap:7px;flex-wrap:wrap}
.admin-row .btn{padding:8px 11px;font-size:.78rem}
.admin-form{position:sticky;top:92px}
.admin-form label{font-size:.8rem;font-weight:700;color:#5e6168;display:grid;gap:6px}
.admin-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex!important;grid-template-columns:auto 1fr!important;align-items:center;gap:8px!important}
.check input{width:auto}
.admin-ad-summary{display:flex;align-items:center;gap:12px;min-width:0}
.admin-ad-summary img{width:110px;height:64px;object-fit:cover;border:1px solid var(--line);border-radius:9px;background:var(--soft)}
.ad-preview{border:1px dashed var(--line-strong);border-radius:12px;padding:12px;background:var(--soft);min-height:72px}
.ad-preview img{display:block;max-width:100%;max-height:180px;object-fit:contain;margin:auto}
.ad{overflow:hidden}
.ad-image-link{display:block;flex:0 0 auto}
.ad-image{display:block;width:min(280px,32vw);max-height:120px;object-fit:contain;border-radius:11px;border:1px solid rgba(0,0,0,.05);background:white}
.ad-copy{min-width:0;flex:1}
.ad-side{display:block;padding:12px}
.ad-side .ad-image{width:100%;max-height:320px}
.ad-side .ad-copy{padding:10px 2px}
.ad-side .btn{margin:5px 0 0;width:100%;text-align:center}
@media(max-width:900px){
  .admin-stats{grid-template-columns:repeat(2,1fr)}
  .admin-layout{grid-template-columns:1fr}
  .admin-form{position:static}
  .ad-image{width:220px}
}
@media(max-width:620px){
  .admin-head,.admin-section-head,.admin-row{align-items:flex-start;flex-direction:column}
  .admin-stats{grid-template-columns:1fr 1fr}
  .admin-two{grid-template-columns:1fr}
  .ad-image{width:100%;max-height:220px}
  .admin-row-actions{width:100%}
}
