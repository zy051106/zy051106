n id="bal">0</span></a><a id="auth" class="btn ghost" href="#/account">Log in</a></div></header><main id="app"><div class="w page"><div class="panel">Loading PromptLab…</div></div></main><footer class="footer"><div class="w row"><b>PromptLab</b><span class="small">Sponsored placements are clearly labeled.</span></div></footer><div id="toast" class="toast"></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const sb=createClient('https://gfgqlkybtnnrcmneupah.supabase.co','sb_publishable_Nk8ZMj7PqNIcdgfq8DVPCQ_7_iYcP2G'),app=document.getElementById('app'),A=document.getElementById('auth'),CP=document.getElementById('cp'),BAL=document.getElementById('bal');const s={u:null,p:null,w:{balance:0},un:new Set(),fav:new Set(),ps:[],cs:[],ads:[]};const E=(v='')=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const R=()=>location.hash.replace(/^#/,'')||'/';const G=x=>location.hash='#'+x;function toast(x){let t=document.getElementById('toast');t.textContent=x;t.className='toast show';setTimeout(()=>t.className='toast',2400)}async function pub(){let[p,c,a]=await Promise.all([sb.from('prompts').select('*,categories(name,slug)').eq('status','published').order('is_featured',{ascending:false}),sb.from('categories').select('*').order('sort_order'),sb.from('ads').select('*').eq('is_active',true)]);s.ps=p.data||[];s.cs=c.data||[];s.ads=a.data||[]}async function usr(){if(!s.u)return;let id=s.u.id,[p,w,u,f]=await Promise.all([sb.from('profiles').select('*').eq('id',id).maybeSingle(),sb.from('wallets').select('*').eq('user_id',id).maybeSingle(),sb.from('prompt_unlocks').select('prompt_id').eq('user_id',id),sb.from('favorites').select('prompt_id').eq('user_id',id)]);s.p=p.data;s.w=w.data||{balance:0};s.un=new Set((u.data||[]).map(x=>x.prompt_id));s.fav=new Set((f.data||[]).map(x=>x.prompt_id))}function nav(){if(s.u){A.textContent=s.p?.display_name||s.u.email.split('@')[0];CP.classList.remove('hide');BAL.textContent=s.w.balance}else{A.textContent='Log in';CP.classList.add('hide')}}function ad(place){let a=s.ads.find(x=>x.placement===place)||s.ads[0];return a?`<aside class="ad"><div><small>Sponsored · ${E(a.sponsor_name)}</small><h4>${E(a.title)}</h4><p>${E(a.body||'')}</p></div><a class="btn" target="_blank" rel="sponsored noopener" href="${E(a.destination_url)}">${E(a.cta_label||'Learn more')} ↗</a></aside>`:''}function card(p){let o=s.un.has(p.id)||+p.price_coins===0;return`<article class="card"><a href="#/prompt/${E(p.slug)}"><div class="cover ${p.cover_style==='cyan'?'cyan':p.cover_style==='gold'?'gold':''}"><span class="badge">${E(p.model)}</span><div class="emoji">${/video|veo|sora/i.test(p.model)?'🎬':'🖼️'}</div></div><div class="body"><div class="meta">${E(p.categories?.name||'AI Prompt')} · ${E(p.difficulty)}</div><h3>${E(p.title)}</h3><p>${E(p.short_description)}</p><div class="foot">${o?`<span class="owned">✓ ${+p.price_coins===0?'Free':'Owned'}</span>`:`<span class="price">● ${p.price_coins}</span>`}<span>Open →</span></div></div></a></article>`}function home(){return`<div class="w"><section class="hero"><div><span class="tag">✦ AI PROMPT LAB + STORE</span><h1>Don't just copy prompts. <span class="grad">Understand them.</span></h1><p class="lead">Browse real prompt systems, learn why they work, then spend coins only when the full reusable prompt is worth keeping.</p><div class="actions"><a class="btn primary" href="#/explore">Explore prompts</a><a class="btn ghost" href="#/about">How it works</a></div></div><div class="panel"><span class="tag">PREMIUM SYSTEM</span><h2>Cinematic Hidden-Camera Photography</h2><p class="small">Camera position → obstruction → focal length → candid behavior</p><div class="fake">camera concealed behind doorway, partial obstruction, long-lens compression, imperfect candid framing...</div><div class="row" style="margin-top:14px"><span>🔒 Full prompt locked</span><b class="price">35 coins</b></div></div></section>${ad('home')}<section class="page"><span class="tag">CURATED SYSTEMS</span><h2>Start with something useful.</h2><div class="grid">${s.ps.slice(0,3).map(card).join('')}</div></section></div>`}function explore(){return`<div class="w page"><span class="tag">PROMPT STORE</span><h1 class="title">Explore the lab.</h1><p class="lead">Search by technique, model or category.</p><div class="search"><input id="q" class="input" placeholder="Search prompts…"><select id="cat"><option value="all">All categories</option>${s.cs.map(c=>`<option value="${E(c.slug)}">${E(c.name)}</option>`).join('')}</select></div>${ad('explore')}<div id="grid" class="grid">${s.ps.map(card).join('')}</div></div>`}async function detail(slug){let p=s.ps.find(x=>x.slug===slug);if(!p){app.innerHTML='<div class="w page"><div class="empty">Prompt not found.</div></div>';return}let o=+p.price_coins===0||s.un.has(p.id),sec=null;if(o){let q=await sb.from('prompt_secrets').select('*').eq('prompt_id',p.id).maybeSingle();sec=q.data}app.innerHTML=`<div class="w page"><a class="small" href="#/explore">← Back</a><div class="prompt" style="margin-top:16px"><article class="panel"><span class="tag">${E(p.categories?.name||'Prompt System')}</span><h1>${E(p.title)}</h1><div class="meta">${E(p.model)} · ${E(p.difficulty)}</div><p class="lead">${E(p.short_description)}</p><h2>Why this works</h2><div class="copy">${E(p.explanation).replace(/\n/g,'<br>')}</div>${o&&sec?`<h2>Full Prompt</h2><div class="secret">${E(sec.full_prompt)}</div><button id="copy" class="btn">Copy prompt</button>`:`<div class="lock"><div style="font-size:2rem">🔒</div><h2>Premium prompt locked</h2><p class="small">Unlock once and keep it permanently.</p><button id="unlock" class="btn primary">${s.u?`Unlock for ${p.price_coins} coins`:'Log in to unlock'}</button></div>`}</article><aside><div class="panel sticky"><h3>${o?'In your library':'Unlock this system'}</h3><div class="info"><span>Price</span><b class="price">${+p.price_coins===0?'Free':p.price_coins+' coins'}</b></div><div class="info"><span>Model</span><b>${E(p.model)}</b></div>${s.u?`<button id="fav" class="btn ghost" style="width:100%;margin-top:10px">${s.fav.has(p.id)?'♥ Saved':'♡ Save for later'}</button><div class="notice" style="margin-top:10px">Balance: <b>${s.w.balance} coins</b></div>`:`<a class="btn primary" style="display:block;text-align:center;margin-top:10px" href="#/account">Create account</a>`}</div>${ad('prompt_detail')}</aside></div></div>`;document.getElementById('copy')?.addEventListener('click',()=>{navigator.clipboard.writeText(sec.full_prompt);toast('Prompt copied')});document.getElementById('unlock')?.addEventListener('click',()=>unlock(p));document.getElementById('fav')?.addEventListener('click',()=>fav(p.id))}async function unlock(p){if(!s.u)return G('/account');if(s.w.balance<+p.price_coins){toast('Not enough coins');return G('/wallet')}let{error}=await sb.rpc('unlock_prompt',{p_prompt_id:p.id});if(error)return toast(error.message);await usr();nav();toast('Unlocked');render()}async function fav(id){if(!s.u)return G('/account');if(s.fav.has(id)){await sb.from('favorites').delete().eq('user_id',s.u.id).eq('prompt_id',id);s.fav.delete(id)}else{await sb.from('favorites').insert({user_id:s.u.id,prompt_id:id});s.fav.add(id)}render()}function need(t){return`<div class="w page"><div class="panel"><span class="tag">ACCOUNT REQUIRED</span><h1 class="title">${E(t)}</h1><a class="btn primary" href="#/account">Continue</a></div></div>`}function library(saved=false){if(!s.u)return need(saved?'Saved prompts':'Your library');let l=s.ps.filter(p=>saved?s.fav.has(p.id):s.un.has(p.id)||+p.price_coins===0);return`<div class="w page"><span class="tag">${saved?'SAVED':'MY LIBRARY'}</span><h1 class="title">${saved?'Saved for later.':'Your unlocked prompts.'}</h1><div class="grid">${l.length?l.map(card).join(''):'<div class="empty">Nothing here yet.</div>'}</div></div>`}async function wallet(){if(!s.u){app.innerHTML=need('Coin Shop');return}let q=await sb.from('coin_transactions').select('*').eq('user_id',s.u.id).order('created_at',{ascending:false}).limit(8);app.innerHTML=`<div class="w page"><span class="tag">WALLET + COIN SHOP</span><h1 class="title">Coins unlock the good stuff.</h1><div class="panel"><div class="small">Current balance</div><div class="wallet">● ${s.w.balance}</div><p class="small">New accounts receive 25 welcome coins.</p></div><h2>Coin packs</h2><div class="packs"><div class="pack"><b>100 coins</b><p class="small">Starter</p><button class="btn ghost" disabled>Stripe pending</button></div><div class="pack"><b>300 + 25</b><p class="small">Popular</p><button class="btn ghost" disabled>Stripe pending</button></div><div class="pack"><b>700 + 100</b><p class="small">Power user</p><button class="btn ghost" disabled>Stripe pending</button></div></div><h2>Activity</h2><div class="panel">${(q.data||[]).map(t=>`<div class="info"><span>${E(t.kind)} · ${E(t.reference||'')}</span><b>${t.amount>0?'+':''}${t.amount}</b></div>`).join('')||'<span class="small">No activity yet.</span>'}</div></div>`}function about(){return`<div class="w page"><span class="tag">HOW IT WORKS</span><h1 class="title">Learn first. Unlock second.</h1><div class="grid"><div class="panel"><h3>1 · Browse</h3><p class="copy">See what each system does and why it works.</p></div><div class="panel"><h3>2 · Unlock</h3><p class="copy">Spend coins once; ownership is saved to your account.</p></div><div class="panel"><h3>3 · Keep</h3><p class="copy">The full secret is returned only to owners.</p></div></div>${ad('home')}</div>`}function account(){if(s.u)return`<div class="w page"><span class="tag">ACCOUNT</span><h1 class="title">Hey, ${E(s.p?.display_name||s.u.email.split('@')[0])}.</h1><div class="auth"><div class="panel"><div class="info"><span>Email</span><b>${E(s.u.email)}</b></div><div class="info"><span>Coins</span><b class="price">${s.w.balance}</b></div><div class="info"><span>Unlocked</span><b>${s.un.size}</b></div><div class="info"><span>Saved</span><b>${s.fav.size}</b></div></div><div class="panel"><button id="logout" class="btn ghost">Log out</button></div></div></div>`;return`<div class="w page"><div class="auth"><div><span class="tag">MEMBER ACCESS</span><h1 class="title">Build your prompt library.</h1><p class="lead">Register, receive 25 welcome coins and unlock premium systems.</p></div><div class="panel"><div class="tabs"><button data-tab="login" class="on">Log in</button><button data-tab="register">Register</button></div><form id="login" class="form"><input class="input" name="email" type="email" placeholder="Email" required><input class="input" name="password" type="password" placeholder="Password" minlength="6" required><button class="btn primary">Log in</button><div id="lm" class="small"></div></form><form id="register" class="form hide"><input class="input" name="name" placeholder="Display name" required><input class="input" name="email" type="email" placeholder="Email" required><input class="input" name="password" type="password" placeholder="Password" minlength="6" required><button class="btn primary">Create account</button><div class="notice">Includes 25 welcome coins.</div><div id="rm" class="small"></div></form></div></div></div>`}function wires(){document.getElementById('logout')?.addEventListener('click',async()=>{await sb.auth.signOut();G('/')});document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));document.getElementById('login')?.classList.toggle('hide',b.dataset.tab!=='login');document.getElementById('register')?.classList.toggle('hide',b.dataset.tab!=='register')}));document.getElementById('login')?.addEventListener('submit',async ev=>{ev.preventDefault();let f=new FormData(ev.currentTarget),m=document.getElementById('lm');m.textContent='Signing in…';let{error}=await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});m.textContent=error?error.message:'Logged in';if(!error)G('/')});document.getElementById('register')?.addEventListener('submit',async ev=>{ev.preventDefault();let f=new FormData(ev.currentTarget),m=document.getElementById('rm');m.textContent='Creating…';let{data,error}=await sb.auth.signUp({email:f.get('email'),password:f.get('password'),options:{data:{display_name:f.get('name')}}});m.textContent=error?error.message:(data.session?'Account created.':'Account created. Check your email, then log in.');if(data.session)G('/')})}function ew(){let q=document.getElementById('q'),c=document.getElementById('cat'),g=document.getElementById('grid'),f=()=>{let t=q.value.toLowerCase(),v=c.value,l=s.ps.filter(p=>(v==='all'||p.categories?.slug===v)&&(!t||[p.title,p.short_description,p.model,p.categories?.name].join(' ').toLowerCase().includes(t)));g.innerHTML=l.map(card).join('')||'<div class="empty">No matches.</div>'};q.addEventListener('input',f);c.addEventListener('change',f)}async function render(){let x=R();if(x==='/')app.innerHTML=home();else if(x==='/explore'){app.innerHTML=explore();ew()}else if(x.startsWith('/prompt/')){await detail(decodeURIComponent(x.split('/')[2]||''));return}else if(x==='/library')app.innerHTML=library();else if(x==='/saved')app.innerHTML=library(true);else if(x==='/wallet'){await wallet();return}else if(x==='/about')app.innerHTML=about();else if(x==='/account')app.innerHTML=account();else app.innerHTML='<div class="w page"><div class="empty">Page not found.</div></div>';wires()}window.addEventListener('hashchange',render);sb.auth.onAuthStateChange(async(_,session)=>{s.u=session?.user||null;if(s.u)await usr();else{s.p=null;s.w={balance:0};s.un=new Set();s.fav=new Set()}nav();render()});(async()=>{let{data:{session}}=await sb.auth.getSession();s.u=session?.user||null;await pub();if(s.u)await usr();nav();render()})();</script></body></html>
